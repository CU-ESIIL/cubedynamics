repo_url: https://github.com/CU-ESIIL/cubedynamics
edit_uri: edit/main/docs/

copyright: 'Copyright \u00a9 2026'

extra:
  google_analytics_id: !ENV [CUBEDYNAMICS_GA_MEASUREMENT_ID, ""]

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  logo: assets/img/cubedynamics_banner.png
  favicon: assets/img/cubedynamics_favicon.png
  custom_dir: docs/overrides

extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css
  - assets/styles/landing_cards_v2.css
  - stylesheets/editorial.css
  - stylesheets/vignettes.css
  - stylesheets/hubs.css
  - stylesheets/manual.css

extra_javascript:
  - javascripts/deferred-embeds.js
  - javascripts/hero-examples.js
  - javascripts/site-motion.js

hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            merge_init_into_class: true
            show_source: false
  - git-revision-date
  - mkdocs-jupyter:
      execute: true
      execute_ignore:
        - "**/examples/temporal_alignment.ipynb"
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - md_in_html
  - toc:
      toc_depth: 2
