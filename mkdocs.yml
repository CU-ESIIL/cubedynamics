site_name: "CubeDynamics"
site_description: "CubeDynamics: an inspectable grammar for environmental data analysis."
site_author: CubeDynamics Team
site_url: "https://cu-esiil.github.io/cubedynamics/"

# Retain historical/generated fixtures for software development without
# publishing them as educational examples. Public learning routes use vetted
# observational data; exact generated truth cases belong in tests/validation.
exclude_docs: |
  overrides/
  recipes/fire_vase_synthetic.md
  recipes/climate_tail_dep_center.md
