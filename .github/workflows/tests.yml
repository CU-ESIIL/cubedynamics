name: Tests

env:
  MPLBACKEND: Agg

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (offline)
        run: |
          pytest -m "not integration and not online" --maxfail=1 --disable-warnings -q

      - name: Run integration tests (optional)
        if: env.RUN_INTEGRATION == '1' && matrix.python-version == '3.11'
        run: |
          pytest -m "integration"

  streaming-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run streaming contract tests
        run: |
          pytest tests/test_prism_ncss_streaming.py \
            tests/test_gridmet_streaming_contract.py \
            tests/test_global_climate_streaming.py \
            tests/test_median_split_synchrony_verb.py \
            tests/test_spatial_units.py \
            tests/test_real_fire_vase_gridmet_smoke.py \
            src/cubedynamics/tests/test_streaming_contracts.py \
            --maxfail=1 --disable-warnings -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m build
          python -m twine check dist/*

      - name: Install built wheel in clean environment
        run: |
          python -m venv .pkg-venv
          .pkg-venv/bin/pip install --upgrade pip
          .pkg-venv/bin/pip install dist/*.whl
          .pkg-venv/bin/python -c "import cubedynamics; import cubedynamics.verbs; print(cubedynamics.__version__)"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,browser]"

      - name: Install browser for website QA
        run: python -m playwright install --with-deps chromium

      - name: Build docs
        env:
          # The site build executes notebooks and must capture their figures.
          MPLBACKEND: module://matplotlib_inline.backend_inline
        run: |
          python scripts/build_visual_docs.py --check
          python scripts/build_visual_docs.py
          python scripts/build_visual_docs.py --check
          python scripts/build_reference_docs.py --check
          mkdocs build --strict
          python scripts/check_site_links.py site

      - name: Run publication validation suite
        run: |
          python scripts/run_validation.py --run-vignettes
          python scripts/run_source_qa.py
          python scripts/run_decision_qa.py

      - name: Browser crawl, images, embeds and cube interaction
        id: browser
        run: |
          pytest tests/browser -m browser --site-dir site --browser chromium \
            --tracing retain-on-failure --screenshot only-on-failure \
            --output artifacts/browser/playwright \
            --junitxml artifacts/browser/junit.xml -q

      - name: External link availability (advisory, not a deployment gate)
        if: always() && steps.browser.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/check_external_links.py site --crawl-report artifacts/browser/crawl.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cubedynamics-validation
          path: |
            artifacts/validation/
            artifacts/source_qa/
            artifacts/decision_qa/
            artifacts/browser/
