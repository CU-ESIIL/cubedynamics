name: Online Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run online tests
        env:
          PYTEST_ADDOPTS: ""
        run: |
          pytest -m "integration or online" --maxfail=1 -q

      - name: Write live source certification evidence
        if: always()
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          python scripts/run_live_source_certification.py

      - name: Upload live source certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-certification
          path: artifacts/source_qa/live/
