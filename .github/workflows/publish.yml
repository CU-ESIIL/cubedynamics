name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m build
          python -m twine check dist/*
          python scripts/check_release_artifact.py --wheel dist/cubedynamics-0.1.0-py3-none-any.whl --sdist dist/cubedynamics-0.1.0.tar.gz --inspect-only --output artifacts/release/distributions.json

      - name: Verify the built wheel before any publication
        run: |
          python -m venv "$RUNNER_TEMP/cubedynamics-release"
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -m pip install dist/cubedynamics-0.1.0-py3-none-any.whl
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -m pip check
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -I scripts/check_release_artifact.py --wheel dist/cubedynamics-0.1.0-py3-none-any.whl --sdist dist/cubedynamics-0.1.0.tar.gz --repo-example --output artifacts/release/installed.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
