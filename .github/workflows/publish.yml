name: Prepare or publish a release

# Tag pushes verify only. Public writes require a separate dispatch that names
# an existing tag and explicitly chooses GitHub or PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to verify or publish"
        required: true
        type: string
      destination:
        description: "Explicit destination (verify performs no public writes)"
        required: true
        default: verify
        type: choice
        options: [verify, github, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      wheel_filename: ${{ steps.release.outputs.wheel_filename }}
      sdist_filename: ${{ steps.release.outputs.sdist_filename }}
      candidate_manifest: ${{ steps.release.outputs.candidate_manifest }}
      output_dir: ${{ steps.release.outputs.output_dir }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Derive and verify release identity
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_REF="refs/tags/$DISPATCH_TAG"
          else
            RELEASE_REF="$GITHUB_REF"
          fi
          python scripts/release_metadata.py \
            --ref "$RELEASE_REF" \
            --commit "$(git rev-parse HEAD)" \
            --require-tag \
            --github-output "$GITHUB_OUTPUT"
          python scripts/check_release_source.py --ref "$RELEASE_REF" --require-tag
      - name: Full non-publishing gate on this exact tagged commit
        env:
          RELEASE_REF: refs/tags/${{ steps.release.outputs.release_tag }}
        run: python scripts/run_release_gate.py --ref "$RELEASE_REF" --output "${{ steps.release.outputs.output_dir }}"
      - name: Assemble and verify the exact tested bundle
        env:
          RELEASE_REF: refs/tags/${{ steps.release.outputs.release_tag }}
          WHEEL: ${{ steps.release.outputs.wheel_filename }}
          SDIST: ${{ steps.release.outputs.sdist_filename }}
          MANIFEST: ${{ steps.release.outputs.candidate_manifest }}
        run: |
          mkdir release-bundle
          cp "dist/$WHEEL" "release-bundle/$WHEEL"
          cp "dist/$SDIST" "release-bundle/$SDIST"
          cp dist/SHA256SUMS release-bundle/SHA256SUMS
          cp "$MANIFEST" "release-bundle/$(basename "$MANIFEST")"
          python scripts/verify_release_bundle.py \
            --directory release-bundle \
            --ref "$RELEASE_REF" \
            --commit "$(git rev-parse HEAD)" \
            --require-tag
      - name: Preserve exact tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          if-no-files-found: error
          path: release-bundle/
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-*/
            manifests/releases/v*-candidate.json

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-bundle/
      - name: Verify exact same-run release bundle
        env:
          RELEASE_REF: refs/tags/${{ needs.build.outputs.release_tag }}
        run: |
          python scripts/check_release_source.py --ref "$RELEASE_REF" --require-tag
          python scripts/verify_release_bundle.py \
            --directory release-bundle \
            --ref "$RELEASE_REF" \
            --commit "${{ needs.build.outputs.commit_sha }}" \
            --require-tag
      - name: Offline contracts for this Python
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -m "not integration and not online" --maxfail=1 --disable-warnings -q
      - name: Verify exact wheel in a new external environment
        env:
          WHEEL: ${{ needs.build.outputs.wheel_filename }}
          SDIST: ${{ needs.build.outputs.sdist_filename }}
          MANIFEST: ${{ needs.build.outputs.candidate_manifest }}
        run: |
          python -m venv "$RUNNER_TEMP/cubedynamics-release"
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -m pip install "release-bundle/$WHEEL"
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -m pip check
          "$RUNNER_TEMP/cubedynamics-release/bin/python" -I scripts/check_release_artifact.py \
            --wheel "release-bundle/$WHEEL" \
            --sdist "release-bundle/$SDIST" \
            --repo-example \
            --output artifacts/release/installed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-wheel-${{ needs.build.outputs.release_version }}-${{ matrix.python-version }}-${{ needs.build.outputs.commit_sha }}
          path: artifacts/release/

  github-release:
    needs: [build, compatibility]
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-bundle/
      - name: Refuse a branch, mismatched tag, or unverified bytes
        env:
          RELEASE_REF: refs/tags/${{ needs.build.outputs.release_tag }}
        run: |
          python scripts/check_release_source.py --ref "$RELEASE_REF" --require-tag
          python scripts/verify_release_bundle.py \
            --directory release-bundle \
            --ref "$RELEASE_REF" \
            --commit "${{ needs.build.outputs.commit_sha }}" \
            --require-tag
      - name: Create the explicitly authorized release with tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          WHEEL: ${{ needs.build.outputs.wheel_filename }}
          SDIST: ${{ needs.build.outputs.sdist_filename }}
        run: |
          args=(release create "$RELEASE_TAG" --verify-tag --title "CubeDynamics $RELEASE_VERSION")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          args+=(--notes "Tested CubeDynamics release artifacts. Verify SHA256SUMS before installation. Support: https://cu-esiil.github.io/cubedynamics/project/release_0_1_0/")
          gh "${args[@]}" \
            "release-bundle/$WHEEL" \
            "release-bundle/$SDIST" \
            release-bundle/SHA256SUMS \
            "release-bundle/$(basename "$MANIFEST")"

  publish:
    needs: [build, compatibility]
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-bundle/
      - name: Refuse a branch, mismatched tag, or unverified bytes
        env:
          RELEASE_REF: refs/tags/${{ needs.build.outputs.release_tag }}
        run: |
          python scripts/check_release_source.py --ref "$RELEASE_REF" --require-tag
          python scripts/verify_release_bundle.py \
            --directory release-bundle \
            --ref "$RELEASE_REF" \
            --commit "${{ needs.build.outputs.commit_sha }}" \
            --require-tag
      - name: Isolate only the verified distributions
        env:
          WHEEL: ${{ needs.build.outputs.wheel_filename }}
          SDIST: ${{ needs.build.outputs.sdist_filename }}
        run: |
          mkdir upload
          cp "release-bundle/$WHEEL" "upload/$WHEEL"
          cp "release-bundle/$SDIST" "upload/$SDIST"
      - name: Publish distributions to PyPI after separate authorization
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
